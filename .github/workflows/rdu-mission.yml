name: RDU Builder Mission

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number to execute'
        required: true
        type: number
      task_prompt:
        description: 'Optional custom task prompt to steer RDU'
        required: false
        type: string
      dry_run:
        description: 'Run in dry-run mode without pushing branch or opening PR'
        required: false
        default: false
        type: boolean

concurrency:
  group: rdu-mission-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  run-builder:
    name: Execute RDU Builder Mission
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:rdu' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Configure Git User
        run: |
          git config --global user.name "RDU Builder Agent [bot]"
          git config --global user.email "rdu-builder@ezvibes.co"

      - name: Run RDU Builder Runner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM="${{ github.event.issue.number || inputs.issue_number }}"
          TASK_FLAG="${{ (inputs.task_prompt && format('--task "{0}"', inputs.task_prompt)) || '' }}"
          DRY_RUN_FLAG="${{ (inputs.dry_run && '--dry-run') || '' }}"
          echo "Executing RDU Builder Mission for Issue #${ISSUE_NUM}..."
          npm run dev:rdu -- --issue "${ISSUE_NUM}" ${TASK_FLAG} ${DRY_RUN_FLAG}
